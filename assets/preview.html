  var BOOKING_CATEGORIES = [
    { id: "attraction", icon: "◇", en: "Attractions", singular: "attraction", zh: "景点" },
    { id: "restaurant", icon: "⌁", en: "Restaurants", singular: "restaurant", zh: "餐厅" },
    { id: "hotel", icon: "▣", en: "Hotels", singular: "hotel", zh: "酒店" }
  ];

  function bookingCategory(item) {
    var explicit = String(item.category || "").toLowerCase();
    if (["attraction", "restaurant", "hotel"].indexOf(explicit) >= 0) return explicit;
    var text = [item.item, item.where, item.note].join(" ").toLowerCase();
    if (/restaurant|dining|dinner|lunch|breakfast|cafe|bistro|meal|餐厅|餐馆|餐饮|晚餐|午餐|早餐|咖啡/.test(text)) {
      return "restaurant";
    }
    if (/hotel|lodg|motel|inn|resort|hostel|cabin|camp|airbnb|住宿|酒店|旅馆|民宿|营地|露营|山庄/.test(text)) {
      return "hotel";
    }
    return "attraction";
  }

  function bookingMatchTokens(value) {
    var stop = ["and", "area", "book", "booking", "cabin", "camp", "campsite", "canyon",
      "city", "direct", "grand", "hotel", "hostel", "inn", "lodge", "lodging", "motel",
      "resort", "the"];
    return (String(value || "").toLowerCase().match(/[a-z0-9\u3400-\u9fff]{3,}/g) || [])
      .filter(function (token) { return stop.indexOf(token) < 0; });
  }

  function sharedBookingTokens(left, right) {
    var rightTokens = bookingMatchTokens(right);
    return bookingMatchTokens(left).filter(function (token, index, tokens) {
      return tokens.indexOf(token) === index && rightTokens.indexOf(token) >= 0;
    }).length;
  }

  function hotelDeadlineScore(hotel, deadline) {
    var deadlineText = [deadline.item, deadline.where, deadline.note].join(" ").toLowerCase();
    var name = String(hotel.name || "").toLowerCase();
    var area = String(hotel.area || "").toLowerCase();
    var score = sharedBookingTokens(hotel.name, deadlineText) * 3 +
      sharedBookingTokens(hotel.area, deadlineText);
    if (name.length >= 4 && deadlineText.indexOf(name) >= 0) score += 10;
    if (area.length >= 4 && deadlineText.indexOf(area) >= 0) score += 8;
    return score;
  }

  function hotelBookingItems(list) {
    var deadlines = list.filter(function (item) { return bookingCategory(item) === "hotel"; });
    var hotels = Array.isArray(T.lodging) ? T.lodging.filter(function (hotel) {
      return hotel && (hotel.name || hotel.area);
    }) : [];
    if (!hotels.length) return deadlines;

    var matches = {};
    var usedDeadlines = {};
    deadlines.forEach(function (deadline, deadlineIndex) {
      var bestHotel = -1;
      var bestScore = 1;
      hotels.forEach(function (hotel, hotelIndex) {
        if (matches[hotelIndex]) return;
        var score = hotelDeadlineScore(hotel, deadline);
        if (score > bestScore) { bestScore = score; bestHotel = hotelIndex; }
      });
      if (bestHotel >= 0) {
        matches[bestHotel] = deadline;
        usedDeadlines[deadlineIndex] = true;
      }
    });

    var merged = hotels.map(function (hotel, hotelIndex) {
      var deadline = matches[hotelIndex] || {};
      var price = deadline.price;
      if (typeof hotel.pricePerNight === "number" && isFinite(hotel.pricePerNight) &&
          hotel.pricePerNight >= 0) {
        price = {
          amount: hotel.pricePerNight,
          currency: price && price.currency ? price.currency : cur,
          unit: "night",
          reliability: price && price.reliability ? price.reliability : "reference"
        };
      }
      return {
        item: hotel.name || deadline.item || hotel.area,
        bookBy: deadline.bookBy || "",
        where: deadline.where || "",
        category: "hotel",
        price: price,
        priority: deadline.priority,
        note: deadline.note,
        stayArea: hotel.area || "",
        nights: hotel.nights,
        booked: hotel.booked === true
      };
    });
    deadlines.forEach(function (deadline, deadlineIndex) {
      if (!usedDeadlines[deadlineIndex]) merged.push(deadline);
    });
    return merged;
  }

  function bookingDateParts(value) {
    var match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(value || ""));
    if (!match) return { short: esc(value || (isZh() ? "待确认" : "TBD")), year: "", iso: "" };
    var months = isZh()
      ? ["1月", "2月", "3月", "4月", "5月", "6月", "7月", "8月", "9月", "10月", "11月", "12月"]
      : ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
    return {
      short: isZh() ? months[Number(match[2]) - 1] + Number(match[3]) + "日"
                    : months[Number(match[2]) - 1] + " " + Number(match[3]),
      year: match[1], iso: value
    };
  }

  function bookingPriceMarkup(item) {
    var price = item.price;
    if (typeof price === "number") price = { amount: price };
    if (!price || typeof price !== "object" || typeof price.amount !== "number" ||
        !isFinite(price.amount) || price.amount < 0) {
      return '<span class="booking-price unknown">' +
        (isZh() ? "价格待确认" : "Check price") + "</span>";
    }
    if (price.amount === 0) {
      return '<span class="booking-price">' + (isZh() ? "免费" : "Free") + "</span>";
    }
    var code = String(price.currency || cur).toUpperCase();
    var symbols = { USD: "$", CAD: "C$", MXN: "MX$", CNY: "¥", RMB: "¥" };
    var symbol = symbols[code] || code + " ";
    var prefix = price.reliability === "estimate" ? "≈" :
      (price.reliability === "reference" ? "~" : "");
    var unit = String(price.unit || "total").toLowerCase();
    var units = isZh()
      ? { person: "/人", night: "/晚", vehicle: "/车", group: "/组", booking: "/次", total: "" }
      : { person: "/person", night: "/night", vehicle: "/vehicle", group: "/group",
          booking: "/booking", total: "" };
    return '<span class="booking-price">' + prefix + symbol +
      Number(price.amount).toLocaleString("en-US") + esc(units[unit] || ("/" + unit)) + "</span>";
  }

  function bookingPanelMarkup(category, items, active) {
    var label = isZh() ? category.zh : category.en;
    var first = null;
    items.some(function (item) {
      var date = bookingDateParts(item.bookBy);
      if (!date.iso) return false;
      first = date;
      return true;
    });
    var earliest = first
      ? (isZh() ? "最早截止 · " : "Earliest deadline · ") + first.short
      : (isZh() ? "暂无截止日期" : "No deadlines yet");
    var title = isZh()
      ? items.length + " 个" + label + "预订需要安排"
      : items.length + " " + category.singular +
        " booking" + (items.length === 1 ? "" : "s") +
        " to schedule";
    var rows = items.map(function (item) {
      var date = bookingDateParts(item.bookBy);
      var source = item.where
        ? "<p>" + (isZh() ? "预订渠道：" : "via ") + esc(item.where) + "</p>" : "";
      var stay = "";
      if (item.stayArea || (typeof item.nights === "number" && item.nights > 0)) {
        var stayBits = [];
        if (item.stayArea) stayBits.push(esc(item.stayArea));
        if (typeof item.nights === "number" && item.nights > 0) {
          stayBits.push(isZh() ? item.nights + " 晚" :
            item.nights + " night" + (item.nights === 1 ? "" : "s"));
        }
        stay = '<p class="booking-stay-meta">' + stayBits.join(" · ") + "</p>";
      }
      var note = item.note ? "<p>" + esc(item.note) + "</p>" : "";
      var price = bookingPriceMarkup(item);
      var priority = item.priority === "high" ? " pri-high" : "";
      var deadlineLabel = date.iso
        ? (isZh() ? "预订截止 " : "Book by ") + item.bookBy
        : (isZh() ? "截止日期待确认" : "Deadline to confirm");
      return '<article class="booking-timeline-row">' +
        '<time class="booking-timeline-date" datetime="' + esc(date.iso) + '" aria-label="' +
          esc(deadlineLabel) + '"><strong>' +
          date.short + "</strong><span>" + date.year + "</span></time>" +
        '<span class="booking-timeline-dot' + priority + '" aria-hidden="true"></span>' +
        '<div class="booking-copy"><div class="booking-title-row"><h3>' + esc(item.item) +
        "</h3>" + price + "</div>" + stay + source + note + "</div></article>";
    }).join("");
    if (!rows) rows = '<p class="booking-empty">' +
      (isZh() ? "这个分类暂时没有需要提前预订的项目。" :
        "Nothing in this category needs advance booking yet.") + "</p>";
    return '<section class="booking-panel" id="booking-panel-' + category.id +
      '" role="tabpanel" tabindex="0" aria-labelledby="booking-tab-' + category.id + '"' +
      (active ? "" : " hidden") + '><div class="booking-panel-head"><div>' +
      '<p class="booking-kicker">' + label + (isZh() ? "预订" : " reservations") + "</p>" +
      "<h2>" + title + '</h2></div><span class="booking-earliest">' + earliest + "</span></div>" +
      '<div class="booking-timeline">' + rows + "</div></section>";
  }

  function renderBookingTabs() {
    var list = T.bookingCountdown || [];
    var lodging = Array.isArray(T.lodging) ? T.lodging : [];
    if (!list.length && !lodging.length) { el("bookingTabs").innerHTML = ""; return; }
    var groups = { attraction: [], restaurant: [], hotel: [] };
    list.forEach(function (item) {
      var category = bookingCategory(item);
      if (category !== "hotel") groups[category].push(item);
    });
    groups.hotel = hotelBookingItems(list);
    BOOKING_CATEGORIES.forEach(function (category) {
      groups[category.id].sort(function (a, b) {
        return String(a.bookBy || "9999").localeCompare(String(b.bookBy || "9999"));
      });
    });
    var tabs = BOOKING_CATEGORIES.map(function (category, index) {
      var label = isZh() ? category.zh : category.en;
      return '<button class="booking-tab" id="booking-tab-' + category.id +
        '" type="button" role="tab" aria-selected="' + (index === 0 ? "true" : "false") +
        '" aria-controls="booking-panel-' + category.id + '" tabindex="' + (index === 0 ? "0" : "-1") +
        '" data-booking-category="' + category.id + '"><span aria-hidden="true">' + category.icon +
        '</span><span>' + label + '</span><span class="booking-tab-count">' + groups[category.id].length +
        "</span></button>";
    }).join("");
    var panels = BOOKING_CATEGORIES.map(function (category, index) {
      return bookingPanelMarkup(category, groups[category.id], index === 0);
    }).join("");
    el("bookingTabs").innerHTML = '<div class="section"><div class="card booking-zone">' +
      '<nav class="booking-tabs" role="tablist" aria-label="' +
      (isZh() ? "预订分类" : "Booking categories") + '">' + tabs +
      '</nav><div class="booking-panels">' + panels + "</div></div></div>";

    var tabButtons = Array.prototype.slice.call(
      el("bookingTabs").querySelectorAll("[data-booking-category]"));
    function activate(button, focus) {
      tabButtons.forEach(function (candidate) {
        var selected = candidate === button;
        candidate.setAttribute("aria-selected", selected ? "true" : "false");
        candidate.setAttribute("tabindex", selected ? "0" : "-1");
        el(candidate.getAttribute("aria-controls")).hidden = !selected;
      });
      if (focus) button.focus();
    }
    tabButtons.forEach(function (button, index) {
      button.addEventListener("click", function () { activate(button, false); });
      button.addEventListener("keydown", function (event) {
        var next = null;
        if (event.key === "ArrowRight") next = (index + 1) % tabButtons.length;
        if (event.key === "ArrowLeft") next = (index - 1 + tabButtons.length) % tabButtons.length;
        if (event.key === "Home") next = 0;
        if (event.key === "End") next = tabButtons.length - 1;
        if (next !== null) { event.preventDefault(); activate(tabButtons[next], true); }
      });
    });
  }

  // ---------- Map ----------
  function navLinks(lat, lng, name) {
    var q = encodeURIComponent(name || (lat + "," + lng));
    var g = "https://www.google.com/maps/search/?api=1&query=" + lat + "," + lng;
    var a = "https://maps.apple.com/?q=" + q + "&ll=" + lat + "," + lng;
    return '<div class="popup-actions">' +
      '<a href="' + g + '" target="_blank" rel="noopener">Google Maps</a>' +
      '<a href="' + a + '" target="_blank" rel="noopener">Apple Maps</a></div>';
  }

  function collectStops() {
    var pts = [], n = 0;
    (T.days || []).forEach(function (d) {
      (d.stops || []).forEach(function (s) {
        if (typeof s.lat === "number" && typeof s.lng === "number" && (s.lat || s.lng)) {
          n++;
          pts.push({ n: n, lat: s.lat, lng: s.lng, name: s.name, type: s.type, date: d.date });
        }
      });
    });
    return pts;
  }

  function renderMap() {
    var pts = collectStops();
    if (typeof L === "undefined" || !pts.length) {
      el("map").style.display = "none";
      el("map-fallback").style.display = "block";
      return;
    }
    try {
      var map = L.map("map", { scrollWheelZoom: false });
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 18, attribution: "&copy; OpenStreetMap contributors"
      }).addTo(map);

      var latlngs = [];
      pts.forEach(function (p) {
        latlngs.push([p.lat, p.lng]);
        var icon = L.divIcon({
          className: "", html:
            '<div style="background:var(--accent);color:#fff;border-radius:50%;width:26px;height:26px;' +
            'display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;' +
            'box-shadow:0 1px 4px rgba(0,0,0,.4);border:2px solid #fff">' + p.n + "</div>",
          iconSize: [26, 26], iconAnchor: [13, 13]
        });
        var pop = "<b>" + esc(p.n + ". " + p.name) + "</b><br><span style='color:#6b6258'>Day " +
          esc(p.date) + "</span>" + navLinks(p.lat, p.lng, p.name);
        L.marker([p.lat, p.lng], { icon: icon }).addTo(map).bindPopup(pop);
      });
      L.polyline(latlngs, { color: getComputedStyle(document.documentElement)
        .getPropertyValue("--accent") || "#c2641a", weight: 3, opacity: .7, dashArray: "6 6" }).addTo(map);
      map.fitBounds(L.latLngBounds(latlngs).pad(0.15));
    } catch (e) {
      el("map").style.display = "none";
      el("map-fallback").style.display = "block";
    }
  }

  // ---------- Days ----------
  function renderDays() {
    var html = (T.days || []).map(function (d, i) { return dayCard(d, i + 1); }).join("");
    el("days").innerHTML = html;
  }
  function dayCard(d, idx) {
    var s = '<div class="card day">';
    s += '<div class="day-head"><span class="day-badge">Day ' + idx + " · " + esc(d.date) + "</span>";
    s += '<span class="day-title">' + esc(d.title) + "</span></div>";

    var meta = [];
    if (typeof d.driveMiles === "number") meta.push("<span>🚗 <b>" + d.driveMiles + " " + distUnit +
      "</b>" + (d.driveTime ? " · " + esc(d.driveTime) : "") + "</span>");
    if (d.overnight) meta.push("<span>🛏️ Overnight: <b>" + esc(d.overnight) + "</b></span>");
    if (d.weather) meta.push("<span>" + (WEATHER_ICONS[d.weather.icon] || "🌡️") + " " +
      esc(d.weather.high) + "°/" + esc(d.weather.low) + "°" + tempUnit + "</span>");
    if (d.timezoneNote) meta.push('<span class="tznote">🕒 ' + esc(d.timezoneNote) + "</span>");
    s += '<div class="day-meta">' + meta.join("") + "</div>";

    if (d.stops && d.stops.length) {
      s += '<ul class="stops">' + d.stops.map(stopRow).join("") + "</ul>";
    }
    if (d.fuelCharging && d.fuelCharging.length) {
      s += '<div class="fuel-row">' + d.fuelCharging.map(function (f) {
        var ico = f.type === "charge" ? "🔌" : "⛽";
        var pw = f.powerKW ? " (" + f.powerKW + "kW)" : "";
        return ico + " " + esc(f.name) + pw + (f.note ? " — " + esc(f.note) : "");
      }).join(" &nbsp;·&nbsp; ") + "</div>";
    }
    if (d.meal) {
      s += '<div class="meal-row">🍽️ ' + esc(d.meal.name) +
        (d.meal.perPerson ? " — ~" + money(d.meal.perPerson) + "/person" : "") + "</div>";
    }
    if (d.risks && d.risks.length) {
      s += '<div class="risks"><b>⚠️ Watch out:</b> ' +
        d.risks.map(esc).join("<br>⚠️ ") + "</div>";
    }
    s += "</div>";
    return s;
  }
  function stopRow(s) {
    var ico = STOP_ICONS[s.type] || STOP_ICONS.default;
    var r = "<li><span class='stop-name'>" + ico + " " + esc(s.name) + "</span>";
    if (s.timedEntry) r += '<span class="tag timed">timed entry</span>';
    if (s.ticket) r += '<span class="tag">' + esc(s.ticket) + "</span>";
    else if (s.type) r += '<span class="tag">' + esc(s.type) + "</span>";
    if (s.note) r += "<div class='stop-note'>" + esc(s.note) + "</div>";
    if (typeof s.lat === "number" && (s.lat || s.lng)) {
      r += navLinks(s.lat, s.lng, s.name);
    }
    return r + "</li>";
  }

  // ---------- Budget ----------
  function renderBudget() {
    var b = T.budget;
    if (!b || !b.items) { el("budget").innerHTML = ""; return; }
    var rows = b.items.map(function (it) {
      var rel = (it.reliability || "estimate").toLowerCase();
      var relLabel = ({ verified: "verified", reference: "~ reference", estimate: "≈ estimate" })[rel] || rel;
      return "<tr><td>" + esc(it.label) + ' <span class="rel ' + esc(rel) + '">' + relLabel + "</span></td>" +
        "<td class='num'>" + money(it.amount) + "</td></tr>";
    }).join("");
    var foot = "<tfoot><tr><td>Total</td><td class='num'>" + money(b.total) + "</td></tr>";
    if (b.perPerson) foot += "<tr><td>Per person</td><td class='num'>" + money(b.perPerson) + "</td></tr>";
    foot += "</tfoot>";
    el("budget").innerHTML =
      '<div><h2 style="font-size:1.15rem;margin:0 0 12px">💰 Budget estimate</h2>' +
      '<div class="card" style="padding:6px 10px"><table><tbody>' + rows + "</tbody>" + foot +
      "</table></div>" +
      "<div class='stop-note' style='margin-top:8px'>Legend: <span class='rel verified'>verified</span> " +
      "<span class='rel reference'>~ reference</span> <span class='rel estimate'>≈ estimate</span>. " +
      "Fuel/lodging are dynamic — confirm before departure.</div></div>";
  }

  // ---------- Tips ----------
  function renderTips() {
    var t = T.tips || [];
    if (!t.length) { el("tips").innerHTML = ""; return; }
    el("tips").innerHTML = "<h2>💡 Tips & local know-how</h2><div class='card' style='padding:14px 18px'>" +
      "<ul class='tips'>" + t.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul></div>";
  }

  // ---------- Share ----------
  function renderShare() {
    var label = isZh() ? "分享这份行程" : "Share this trip";
    el("share").innerHTML = '<button class="share-button" id="shareButton" type="button">↗ ' +
      label + '</button><div class="share-status" id="shareStatus" aria-live="polite"></div>';
    el("shareButton").addEventListener("click", function () {
      var data = { title: T.title || "Road Trip", url: window.location.href };
      if (navigator.share) { navigator.share(data).catch(function () {}); return; }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(data.url).then(function () {
          el("shareStatus").textContent = isZh() ? "链接已复制" : "Link copied";
        }).catch(function () {});
      }
    });
  }

  // ---------- Disclaimer ----------
  function renderDisclaimer() {
    var d = T.disclaimer || "Information assembled by AI; verify with official sources before travel.";
    el("disclaimer").innerHTML = '<div class="disclaimer">⚠️ ' + esc(d) + "</div>";
    el("footer-meta").innerHTML = "Generated " + esc(T.generationDate || "") +
      " · <a href='https://github.com/Waybox-AI/roadtrip-skill' rel='generator'>RoadTrip Navigator</a>" +
      " · map data © OpenStreetMap contributors";
  }

  // ---------- Boot ----------
  try {
    renderHero(); renderRoutes(); renderBookingTabs(); renderCrossBorder();
    renderDays(); renderEvPlan();
    renderBudget(); renderTips(); renderShare(); renderDisclaimer();
    renderMap();
  } catch (err) {
    el("app").insertAdjacentHTML("afterbegin",
      "<div class='disclaimer'>Render error: " + esc(err.message) + "</div>");
  }
})();
</script>
</body>
